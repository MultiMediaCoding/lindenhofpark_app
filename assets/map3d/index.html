<title>Lindenhofpark 3D</title>
<style>
/* Layout: one full-screen map; controls and the tree card float above it like a maps app. */
:root {
  --base: #f3f2ec;        /* map ground outside the park */
  --ink: #1d2420;         /* primary text */
  --ink-soft: #5d6a62;    /* secondary text */
  --panel: rgba(255, 255, 252, 0.9);
  --panel-line: rgba(29, 36, 32, 0.1);
  --leaf: #4fae52;        /* accent: marker and active states */
  --leaf-soft: #e4f4dc;
  --dot: #1a7cf9;         /* location blue */
  --water-ink: #3f93c4;
  --label: #55655a;
  --label-halo: rgba(255, 255, 250, 0.92);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
html, body { height: 100%; }
body { background: var(--base); color: var(--ink); font-family: var(--ui); font-size: 15px; overflow: hidden; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#scene.grabbing { cursor: grabbing; }
#scene.pointing { cursor: pointer; }



/* Easter Egg: Lindenhof Open */

.maplabel { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; font: 600 12.5px/1.1 var(--round); color: var(--label); paint-order: stroke fill; -webkit-text-stroke: 3.5px var(--label-halo); letter-spacing: 0.01em; will-change: transform; }
.maplabel.water { color: var(--water-ink); font-style: italic; font-weight: 500; font-size: 15px; -webkit-text-stroke: 3.5px rgba(214, 240, 253, 0.9); }
.maplabel.poi { color: #a2573f; }
.maplabel.peak { color: #55708f; font-size: 11.5px; font-weight: 600; }
#app.night .maplabel.peak { color: #c9d8f2; }
.maplabel.area { color: #3f8a43; }
.maplabel.road { color: #6d777c; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
#app.night .maplabel { color: #e8ecf8; -webkit-text-stroke: 3.5px rgba(20, 28, 54, 0.85); }
#app.night .maplabel.poi { color: #ffd9a3; }
#app.night .maplabel.area { color: #a9e6c0; }
#app.night .maplabel.water { color: #9fc4f2; }
#app.night #credit { color: rgba(220, 228, 245, 0.7); }

#pin { position: absolute; left: 0; top: 0; width: 34px; height: 42px; margin: -42px 0 0 -17px; pointer-events: none; will-change: transform; filter: drop-shadow(0 3px 5px rgba(30, 60, 30, 0.3)); }


[hidden] { display: none !important; }
html, body { margin: 0; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.place-pin { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; padding: 0; border-radius: 50%; border: 2.5px solid #fff; background: #a2573f; box-shadow: 0 3px 8px rgba(40,50,40,0.3); display: grid; place-items: center; cursor: pointer; will-change: transform; }
.place-pin svg { width: 16px; height: 16px; fill: #fff; }
.star-pin { position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: #f2b134; box-shadow: 0 2px 6px rgba(40,50,40,0.35); display: grid; place-items: center; pointer-events: auto; will-change: transform; }
.star-pin svg { width: 14px; height: 14px; fill: #fff; }
#places { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.place-pin { pointer-events: auto; }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-soft); }
</style></head>

var LAT0 = 47.55735, LON0 = 9.6614, KX = 75130, KY = 111320;

function stepFx(dt, time) { if (selected) selRing.scale.setScalar(selBase * (1 + 0.1 * Math.sin(time * 4))); stepTwist(dt); }
